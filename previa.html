<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia Bel nova</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0c0f;font-family:"DM Sans",system-ui,sans-serif;color:#eee}
.ph{max-width:430px;margin:0 auto;padding:14px 12px 28px;box-sizing:border-box}
h4{margin:18px 4px 10px;color:#f5b820;font-size:13px;letter-spacing:2px}
.card{border:1px solid rgba(240,180,41,.35);border-radius:22px;overflow:hidden;background:#090909}
.hero{position:relative;display:grid;grid-template-columns:44% 1fr;align-items:center;min-height:260px}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left 18%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 38%,rgb(9 9 9/60%) 62%,rgb(9 9 9/85%) 100%)}
.id{grid-column:2;position:relative;z-index:1;padding:20px 18px 20px 4px}
.nome{margin:0;font-size:30px;font-weight:600;color:#F7F3E8}.cargo{margin:8px 0;color:#F8D778;font-size:15px;font-weight:500}
.pro{display:inline-block;background:linear-gradient(180deg,#f9cf55,#e8a412);color:#17110a;font-size:11px;font-weight:800;padding:3px 9px;border-radius:12px;margin:6px 0 10px}
.desc{margin:0;color:#C2BAA8;font-size:13px}
.st{padding:16px 18px;color:#8BD6A0;font-size:14px}.st:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#8BD6A0;margin-right:8px;box-shadow:0 0 8px #8BD6A0}
.claro{background:#fff;border-color:#e4e4e7}.claro .hero{min-height:0;align-items:stretch}.claro .hero:after{display:none}
.claro .hero img{position:static;min-height:254px}.claro .id{padding:18px 16px}.claro .nome{color:#111;font-weight:700;font-size:28px}.claro .cargo{color:#5b6068;font-size:17px}.claro .desc{color:#5b6068;font-size:14px}
.av{display:flex;gap:16px;align-items:center;margin:10px 4px}.av img{width:56px;height:56px;border-radius:50%;border:2px solid #f0b429;box-shadow:0 0 12px rgba(240,180,41,.5)}
</style><body><div class="ph">
<h4>TEMA ESCURO</h4>
<div class="card"><div class="hero"><img src="bel-hero-v2.jpg" alt=""><div class="id"><h2 class="nome">Bel</h2><div class="cargo">Nutricionista IA</div><span class="pro">PRO</span><p class="desc">Sua nutricionista - conhece seu objetivo e sua rotina</p></div></div><div class="st">Responde em segundos</div></div>
<h4>TEMA CLARO</h4>
<div class="card claro"><div class="hero"><img src="bel-retrato-v2.jpg" alt=""><div class="id"><h2 class="nome">Bel</h2><div class="cargo">Nutricionista IA</div><span class="pro">PRO</span><p class="desc">Sua nutricionista - conhece seu objetivo e sua rotina</p></div></div></div>
<h4>ÍCONE DA BEL (BOLINHA)</h4>
<div class="av"><img src="bel-avatar-v2.png" alt=""><span style="color:#aaa;font-size:13px">Aparece no botão flutuante e no chat</span></div>
</div></body></html>
