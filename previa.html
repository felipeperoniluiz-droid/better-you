.fia-hero{padding:20px 16px 20px 18px}
.fia-hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:12px;align-items:center}
.fia-pro{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 10px;border-radius:20px;border:1.5px solid #e8a920;background:rgba(12,10,6,.72);color:#f5c542;font-size:12.5px;font-weight:800;letter-spacing:.5px;box-shadow:0 0 12px rgba(240,180,41,.2)}
.fia-titulo{font-size:34px;font-weight:800;line-height:1.05;margin:12px 0 9px;color:#fff;letter-spacing:-.5px}
.fia-sub{font-size:13px;color:#a8adb5;line-height:1.5;margin-bottom:16px}
.fia-feats{display:flex;flex-direction:column;gap:13px}
.fia-feat{display:flex;gap:10px;align-items:center}
.fia-ic{position:relative;flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#1d1709,#0a0805 70%);border:1.5px solid rgba(240,180,41,.6);box-shadow:0 0 12px rgba(240,180,41,.28),inset 0 0 8px rgba(240,180,41,.12)}
.fia-ic svg{width:19px;height:19px;fill:none;stroke:#f5b820;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fia-ic svg.fia-cheio{fill:#f5b820;stroke:none}
.fia-feat-t{font-size:12.5px;font-weight:700;color:#f5b820;line-height:1.25}
.fia-feat-d{font-size:11px;color:#9aa0a8;line-height:1.35;margin-top:2px}
.fia-foto{position:relative;border-radius:18px;overflow:hidden;border:1.5px solid rgba(245,190,60,.8);box-shadow:0 0 18px rgba(240,180,41,.35),0 0 2px rgba(240,180,41,.6);background:#0d0d0d;aspect-ratio:390/515}
.fia-foto img{width:100%;height:100%;object-fit:cover;display:block}
.fia-botoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.fia-btn{display:flex;align-items:center;gap:9px;padding:12px 10px 12px 11px;border-radius:18px;cursor:pointer;text-align:left;font-family:inherit;min-width:0;transition:transform .12s,box-shadow .2s}
.fia-btn:active{transform:scale(.97)}
.fia-btn-cam{background:linear-gradient(135deg,#f9cf55 0%,#f0b429 45%,#d99a0e 100%);border:1px solid rgba(255,225,140,.6);box-shadow:0 6px 22px rgba(240,180,41,.35),inset 0 1px 0 rgba(255,245,200,.55)}
.fia-btn-cam:active{box-shadow:0 0 30px rgba(240,180,41,.65),inset 0 1px 0 rgba(255,245,200,.55)}
.fia-btn-gal{background:linear-gradient(180deg,#1c1e22,#0e0f12);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.fia-btn-gal:active{box-shadow:0 0 22px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.06)}
.fia-btn-ic{flex:0 0 auto;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.fia-btn-ic svg{width:21px;height:21px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fia-btn-cam .fia-btn-ic{background:radial-gradient(circle at 50% 35%,#2a210c,#120d04 70%);box-shadow:0 0 0 2px rgba(120,80,0,.35),0 3px 8px rgba(0,0,0,.35)}
.fia-btn-cam .fia-btn-ic svg{stroke:#f5b820}
.fia-btn-gal .fia-btn-ic{background:radial-gradient(circle at 50% 35%,#24262b,#08090b 70%);border:1px solid rgba(255,255,255,.18);box-shadow:0 0 10px rgba(255,255,255,.06)}
.fia-btn-gal .fia-btn-ic svg{stroke:#fff}
.fia-btn-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.fia-btn-t{font-size:15px;font-weight:800;line-height:1.2}
.fia-btn-d{font-size:11.5px;line-height:1.3;margin-top:2px}
.fia-btn-cam .fia-btn-t{color:#17110a}.fia-btn-cam .fia-btn-d{color:rgba(23,17,10,.72)}
.fia-btn-gal .fia-btn-t{color:#fff}.fia-btn-gal .fia-btn-d{color:#9aa0a8}
.fia-chev{flex:0 0 auto;width:16px;height:16px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fia-btn-cam .fia-chev{stroke:#17110a}.fia-btn-gal .fia-chev,.fia-priv .fia-chev{stroke:#c9ccd1}
.fia-como{padding:18px 12px 18px}
.fia-como-t{font-size:19px;font-weight:800;color:#fff;margin:0 4px 18px}
.fia-passos{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;position:relative}
.fia-passos:before{content:&quot;&quot;;position:absolute;top:24px;left:12.5%;right:12.5%;height:2px;background:repeating-linear-gradient(90deg,#f0b429 0 6px,transparent 6px 13px);opacity:.85}
.fia-passo{text-align:center;position:relative;z-index:1}
.fia-ic-g{width:50px;height:50px;margin:0 auto 16px;background:radial-gradient(circle at 50% 35%,#1f180a,#0a0805 72%);box-shadow:0 0 0 4px #0b0b0b,0 0 16px rgba(240,180,41,.3),inset 0 0 10px rgba(240,180,41,.14)}
.fia-ic-g svg{width:23px;height:23px}
.fia-ic-g b{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);width:21px;height:21px;border-radius:50%;background:linear-gradient(180deg,#f9cf55,#e8a412);color:#120d04;font-size:12px;font-weight:800;line-height:21px;text-align:center;box-shadow:0 0 0 2.5px #0b0b0b}
.fia-passo-d{font-size:11.5px;color:#d9dce0;line-height:1.35;padding:0 2px}
.fia-priv{display:flex;align-items:center;gap:13px;padding:16px 14px 16px 16px}
.fia-ic-priv{margin:0;width:48px;height:48px;box-shadow:0 0 16px rgba(240,180,41,.3),inset 0 0 10px rgba(240,180,41,.14)}
.fia-ic-priv svg{width:24px;height:24px}
.fia-ic svg .fia-furo{fill:none;stroke:#120d04;stroke-width:1.8}
.fia-ic svg .fia-furo-c{fill:#120d04;stroke:none}
.fia-priv-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.fia-priv-t{font-size:14.5px;font-weight:700;color:#fff;margin-bottom:4px}
.fia-priv-d{font-size:12px;color:#9aa0a8;line-height:1.5}
#tab-foto .subtab-btn{font-size:12.5px;line-height:1.2;padding:10px 6px;gap:6px}#tab-foto .subtab-btn svg{width:17px;height:17px}
.fia-sub{font-size:12.5px;margin-bottom:14px}.fia-feats{gap:11px}.fia-feat{gap:9px}.fia-feat .fia-ic{width:34px;height:34px}.fia-feat .fia-ic svg{width:17px;height:17px}.fia-feat-t{font-size:12px}.fia-feat-d{font-size:10.5px}.fia-hero-grid{grid-template-columns:1.1fr .9fr}
.fia-btn-ic{width:38px;height:38px}.fia-btn-ic svg{width:19px;height:19px}.fia-btn{gap:8px}.fia-btn-t{font-size:14.5px}.fia-btn-d{font-size:11px}
.fia-ic-g svg{width:25px;height:25px}.fia-passo-d{font-size:11px}
@media (max-width:370px){.fia-titulo{font-size:30px}.fia-btn-ic{width:38px;height:38px}.fia-btn-t{font-size:14px}.fia-btn-d{font-size:11px}.fia-passo-d{font-size:10.5px}}
/* tema claro: mesma estrutura, superfícies claras e dourado mais escuro para contraste */
html[data-theme=&quot;light&quot;] #tab-foto .subtab-row{background:var(--surface2);border-color:var(--border)}
html[data-theme=&quot;light&quot;] #tab-foto .subtab-btn{color:var(--text2)!important}
html[data-theme=&quot;light&quot;] #tab-foto .subtab-btn.active{background:linear-gradient(180deg,rgba(240,180,41,.3),rgba(240,180,41,.12))!important;border-color:rgba(200,140,20,.6)!important;color:#8a5a00!important;box-shadow:0 2px 10px rgba(200,140,20,.15)!important}
html[data-theme=&quot;light&quot;] .fia-ouro,html[data-theme=&quot;light&quot;] .fia-feat-t{color:#a16207}
html[data-theme=&quot;light&quot;] .fia-card{background:var(--surface2);border-color:rgba(200,140,20,.3);box-shadow:0 4px 18px rgba(0,0,0,.06)}
html[data-theme=&quot;light&quot;] .fia-titulo,html[data-theme=&quot;light&quot;] .fia-como-t,html[data-theme=&quot;light&quot;] .fia-priv-t{color:var(--text)}
html[data-theme=&quot;light&quot;] .fia-sub,html[data-theme=&quot;light&quot;] .fia-feat-d,html[data-theme=&quot;light&quot;] .fia-priv-d{color:var(--text2)}
html[data-theme=&quot;light&quot;] .fia-passo-d{color:var(--text)}
html[data-theme=&quot;light&quot;] .fia-pro{background:#1a1408;color:#f5c542}
html[data-theme=&quot;light&quot;] .fia-ic{background:radial-gradient(circle at 50% 35%,#fffaf0,#fdf0d2 75%);border-color:rgba(200,140,20,.55);box-shadow:0 2px 8px rgba(200,140,20,.18)}
html[data-theme=&quot;light&quot;] .fia-ic svg{stroke:#b07a0c}
html[data-theme=&quot;light&quot;] .fia-ic svg.fia-cheio{fill:#c98a0c}
html[data-theme=&quot;light&quot;] .fia-ic svg .fia-furo{stroke:#fff8e6}
html[data-theme=&quot;light&quot;] .fia-ic svg .fia-furo-c{fill:#fff8e6}
html[data-theme=&quot;light&quot;] .fia-ic-g{box-shadow:0 0 0 4px var(--surface2),0 2px 10px rgba(200,140,20,.2)}
html[data-theme=&quot;light&quot;] .fia-ic-g b{box-shadow:0 0 0 2.5px var(--surface2)}
html[data-theme=&quot;light&quot;] .fia-btn-gal{background:var(--surface2);border-color:var(--border);box-shadow:0 2px 10px rgba(0,0,0,.06)}
html[data-theme=&quot;light&quot;] .fia-btn-gal .fia-btn-ic{background:var(--surface3);border-color:var(--border);box-shadow:none}
html[data-theme=&quot;light&quot;] .fia-btn-gal .fia-btn-ic svg{stroke:var(--text)}
html[data-theme=&quot;light&quot;] .fia-btn-gal .fia-btn-t{color:var(--text)}
html[data-theme=&quot;light&quot;] .fia-btn-gal .fia-btn-d{color:var(--text2)}
html[data-theme=&quot;light&quot;] .fia-btn-gal .fia-chev,html[data-theme=&quot;light&quot;] .fia-priv .fia-chev{stroke:var(--text2)}
html[data-theme=&quot;light&quot;] .fia-btn-cam{background:linear-gradient(135deg,#f9cf55 0%,#f0b429 45%,#d99a0e 100%)!important;border:1px solid rgba(200,140,20,.5)!important;box-shadow:0 6px 18px rgba(240,180,41,.3)!important}
html[data-theme=&quot;light&quot;] .fia-btn-cam .fia-btn-t{color:#17110a!important}html[data-theme=&quot;light&quot;] .fia-btn-cam .fia-btn-d{color:rgba(23,17,10,.75)!important}
/* brilho (pedido 31/10, igual ao modelo): halo dourado nos círculos dos ícones, pulsar suave no da Câmera */
.fia-ic-g{border-color:rgba(250,200,70,.9);box-shadow:0 0 0 4px #0b0b0b,0 0 22px rgba(240,180,41,.55),0 0 6px rgba(255,210,90,.6),inset 0 0 14px rgba(240,180,41,.3)}
.fia-ic-g svg{filter:drop-shadow(0 0 4px rgba(255,200,60,.65))}
.fia-ic-g b{box-shadow:0 0 0 2.5px #0b0b0b,0 0 10px rgba(255,200,60,.75)}
.fia-feat .fia-ic{border-color:rgba(250,200,70,.85);box-shadow:0 0 16px rgba(240,180,41,.45),inset 0 0 10px rgba(240,180,41,.22)}
.fia-feat .fia-ic svg{filter:drop-shadow(0 0 3px rgba(255,200,60,.55))}
.fia-btn-cam{box-shadow:0 0 22px rgba(240,180,41,.45),0 6px 22px rgba(240,180,41,.3),inset 0 1px 0 rgba(255,245,200,.6)}
.fia-btn-cam .fia-btn-ic{border:1.5px solid rgba(255,215,110,.9);box-shadow:0 0 0 5px rgba(255,200,60,.22),0 0 18px 4px rgba(255,190,40,.75);animation:fiaPulsar 2.6s ease-in-out infinite}
.fia-btn-cam .fia-btn-ic svg{filter:drop-shadow(0 0 3px rgba(255,200,60,.7))}
.fia-btn-gal{border-color:rgba(255,255,255,.2);box-shadow:0 0 16px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.1)}
.fia-btn-gal .fia-btn-ic{border-color:rgba(255,255,255,.45);box-shadow:0 0 0 4px rgba(255,255,255,.07),0 0 16px 2px rgba(255,255,255,.28)}
.fia-btn-gal .fia-btn-ic svg{filter:drop-shadow(0 0 3px rgba(255,255,255,.5))}
.fia-ic-priv{box-shadow:0 0 22px rgba(240,180,41,.55),0 0 6px rgba(255,210,90,.6),inset 0 0 14px rgba(240,180,41,.3)}
@keyframes fiaPulsar{0%,100%{box-shadow:0 0 0 4px rgba(255,200,60,.16),0 0 14px 2px rgba(255,190,40,.55)}50%{box-shadow:0 0 0 7px rgba(255,200,60,.26),0 0 26px 6px rgba(255,190,40,.85)}}
@media (prefers-reduced-motion:reduce){.fia-btn-cam .fia-btn-ic{animation:none}}
html[data-theme=&quot;light&quot;] .fia-ic-g{box-shadow:0 0 0 4px var(--surface2),0 0 16px rgba(220,150,20,.4)}
html[data-theme=&quot;light&quot;] .fia-ic-g svg,html[data-theme=&quot;light&quot;] .fia-feat .fia-ic svg{filter:none}
html[data-theme=&quot;light&quot;] .fia-ic-g b{box-shadow:0 0 0 2.5px var(--surface2),0 0 8px rgba(220,150,20,.5)}
html[data-theme=&quot;light&quot;] .fia-feat .fia-ic{box-shadow:0 0 12px rgba(220,150,20,.3)}
html[data-theme=&quot;light&quot;] .fia-ic-priv{box-shadow:0 0 16px rgba(220,150,20,.4)}
html[data-theme=&quot;light&quot;] .fia-btn-gal .fia-btn-ic{box-shadow:0 0 10px rgba(0,0,0,.08)}
html[data-theme=&quot;light&quot;] .fia-btn-gal .fia-btn-ic svg{filter:none}
html[data-theme=&quot;light&quot;] .fia-btn-gal{box-shadow:0 0 14px rgba(0,0,0,.08)}
/* ── Progresso do seu corpo, layout novo (31/10/2026) — reaproveita .fia-* ── */
.pgr-hero{position:relative;overflow:hidden;padding:20px 16px 20px 18px;min-height:330px;background:#060606}
.pgr-hero-img{position:absolute;top:0;right:0;bottom:0;aspect-ratio:494/484;max-width:78%;container-type:inline-size}
.pgr-hero-img img{width:100%;height:100%;object-fit:cover;object-position:left top;display:block}
.pgr-hero-img:before{content:&quot;&quot;;position:absolute;inset:0;background:linear-gradient(90deg,#060606 0%,rgba(6,6,6,.85) 14%,rgba(6,6,6,0) 42%);z-index:1;pointer-events:none}
.pgr-tag{position:absolute;z-index:2;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.4px;border-radius:7px;font-size:clamp(8px,2.9cqw,13px);line-height:1;white-space:nowrap}
.pgr-tag-antes{left:52%;top:85.2%;width:19.4%;height:7.6%;background:#141414;color:#e9e9e9;border:1px solid rgba(255,255,255,.18)}
.pgr-tag-depois{left:77.7%;top:85.2%;width:18%;height:7.6%;background:linear-gradient(180deg,#f9cf55,#e8a412);color:#17110a}
.pgr-tag-kg{left:74.4%;top:11.2%;width:25%;height:13.8%;flex-direction:column;gap:2px;background:#0b0b0b;border:1px solid rgba(240,180,41,.55);border-radius:10px;box-shadow:0 0 10px rgba(240,180,41,.25)}
.pgr-tag-kg b{display:flex;align-items:center;gap:3px;color:#fff;font-size:clamp(9px,3.2cqw,14px)}
.pgr-tag-kg b svg{width:1em;height:1em;fill:none;stroke:#f5b820;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pgr-tag-kg i{font-style:normal;font-weight:500;color:#b9bdc3;font-size:clamp(7px,2.4cqw,11px);letter-spacing:0}
.pgr-hero-txt{position:relative;z-index:3;width:58%}
.pgr-titulo{font-size:27px;font-weight:800;line-height:1.08;color:#fff;letter-spacing:-.4px;margin-bottom:10px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.pgr-titulo .fia-ouro{display:block;font-size:31px}
.pgr-sub{font-size:12.5px;color:#a8adb5;line-height:1.45;margin-bottom:14px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.pgr-hero .fia-feat-t.pgr-branco{color:#fff}
.pgr-hero .fia-feat-d{text-shadow:0 1px 5px rgba(0,0,0,.8)}
.fia-ic svg .pgr-tr{fill:none;stroke:#f5b820;stroke-width:1.9}
.pgr-bloco{padding:18px 14px 16px}
.pgr-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.pgr-h{font-size:18px;font-weight:800;color:#fff;line-height:1.2}
.pgr-sel-w{position:relative;flex:0 0 auto}
.pgr-sel{appearance:none;-webkit-appearance:none;background:#0b0b0b;border:1px solid rgba(255,255,255,.18);border-radius:20px;color:#e9e9e9;font:inherit;font-size:12.5px;font-weight:600;padding:8px 32px 8px 14px;cursor:pointer;outline:none}
.pgr-sel-w svg{position:absolute;right:11px;top:50%;width:15px;height:15px;transform:translateY(-50%);fill:none;stroke:#e9e9e9;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pgr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pgr-vazio{grid-column:1/-1;border:1.5px dashed rgba(240,180,41,.4);border-radius:16px;padding:24px 14px;text-align:center;background:rgba(240,180,41,.02)}
.pgr-vazio svg{width:44px;height:44px;margin-bottom:10px;fill:none;stroke:#b9bdc3;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pgr-vazio svg .pgr-mais{fill:#f5b820;stroke:none}
.pgr-vazio svg .pgr-mais-x{stroke:#120d04;stroke-width:1.8}
.pgr-vazio-t{font-size:14px;font-weight:700;color:#fff;margin-bottom:6px}
.pgr-vazio-d{font-size:12px;color:#a8adb5;line-height:1.5}
.pgr-pill{flex:0 0 auto;padding:7px 14px;border-radius:20px;border:1px solid rgba(240,180,41,.45);background:rgba(240,180,41,.1);color:#f5b820;font-size:12.5px;font-weight:700;white-space:nowrap}
.pgr-res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.pgr-res-d{font-size:10.5px;color:#9aa0a8;line-height:1.35}
.pgr-banner{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:18px 16px;min-height:112px;border-color:rgba(240,180,41,.35);background:linear-gradient(90deg,#120d04,#070707 60%)}

.pgr-alvo svg{width:28px;height:28px}
.fia-ic svg .pgr-cheio{fill:#f5b820;stroke:none}
.pgr-banner-txt{position:relative;z-index:1;min-width:0;max-width:62%}
.pgr-banner-t{font-size:17px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:6px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.pgr-banner-d{font-size:12px;color:#a8adb5;text-shadow:0 1px 6px rgba(0,0,0,.8)}
